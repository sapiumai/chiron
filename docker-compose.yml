services:
  chiron:
    build: .
    env_file:
      - .env
    environment:
      # chiron_cache.db.create_pool() composes the DSN itself from
      # POSTGRES_USER/PASSWORD/DB (already in .env) plus this host —
      # Postgres itself is not part of this compose file; it's the shared
      # server run by ~/Projects/docker_servers/DB/Postgres, reached here by
      # joining its external docker_shared_network (container_name: postgres
      # there, hence this hostname).
      - POSTGRES_HOST=postgres
    volumes:
      - tradingagents_data:/home/appuser/.tradingagents
    networks:
      - docker_shared_network
    tty: true
    stdin_open: true

  worker-daemon:
    build: .
    entrypoint: ["python", "-m", "chiron_worker"]
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
    networks:
      - docker_shared_network

volumes:
  tradingagents_data:

networks:
  docker_shared_network:
    external: true
