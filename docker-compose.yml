services:
  tradingagents:
    build: .
    env_file:
      - .env
    volumes:
      - tradingagents_data:/home/appuser/.tradingagents
    tty: true
    stdin_open: true

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - ollama

  tradingagents-ollama:
    build: .
    env_file:
      - .env
    environment:
      - TRADINGAGENTS_LLM_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://ollama:11434/v1
    volumes:
      - tradingagents_data:/home/appuser/.tradingagents
    depends_on:
      - ollama
    tty: true
    stdin_open: true
    profiles:
      - ollama

  postgres:
    image: postgres:18-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  worker-daemon:
    build: .
    entrypoint: ["python", "-m", "chiron_worker"]
    env_file:
      - .env
    environment:
      # chiron_cache.db.create_pool() composes the DSN itself from
      # POSTGRES_USER/PASSWORD/DB (already in .env) plus this host — no
      # second, independently-set connection string to keep in sync.
      - POSTGRES_HOST=postgres
    depends_on:
      - postgres

volumes:
  tradingagents_data:
  ollama_data:
  postgres_data:
